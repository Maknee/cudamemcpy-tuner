[package]
name = "cmt-evaluate"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[workspace]

[[bin]]
name = "cmt-evaluate"
path = "runner/main.rs"

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.5.58", features = ["derive"] }
indicatif = { version = "=0.18.6", default-features = false, features = ["unicode-width"] }
rustix = { version = "=1.1.4", features = ["fs", "param", "process"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
signal-hook = { version = "=0.3.18", default-features = false }
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "deny"
