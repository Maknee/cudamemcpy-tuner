[package]
name = "cudamemcpy-site"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"

[dependencies]
dioxus = { version = "=0.7.10", features = ["router"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Offline export only; never shipped to the browser or hosting service.
duckdb = { version = "1", features = ["bundled"], optional = true }
sha2 = { version = "0.11", optional = true }
regex = { version = "1", optional = true }

# web-only
web-sys = { version = "0.3", features = ["Window", "Location", "History", "UrlSearchParams", "Document", "Element", "HtmlElement", "Blob", "BlobPropertyBag", "Url"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
futures-util = { version = "0.3", optional = true }
gloo-net = { version = "0.7", default-features = false, features = ["http"], optional = true }

[features]
default = []
web = ["dioxus/web", "dep:web-sys", "dep:wasm-bindgen", "dep:js-sys", "dep:gloo-net", "dep:futures-util"]
export = ["dep:duckdb", "dep:sha2", "dep:regex"]

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = false
debug = false


# Build independently of any enclosing Cargo workspace.
[workspace]
