# Weekly update pull requests for the pinned GitHub Actions (full commit SHAs in .github/workflows) and the Rust
# crates (versions resolved in Cargo.lock). The C++ libraries pinned in cmake/Dependencies.cmake
# and the CUDA packages in .github/scripts/install_cuda.sh are updated by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: cargo
    directories:
      - /tools/sigscan
      - /evaluation
      - /site
    schedule:
      interval: weekly
    groups:
      crates:
        patterns: ['*']
